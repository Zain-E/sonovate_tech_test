[project]
name = "sonovate-tech-test"
version = "0.1.0"
description = "Companies House search data warehouse: dlt -> DuckDB -> dbt -> Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dlt[duckdb,parquet]>=1.32,<2",
    "dbt-core>=1.11,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "requests-mock>=1.12",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
